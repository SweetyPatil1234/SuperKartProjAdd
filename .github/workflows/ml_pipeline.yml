
name: SuperKart ML Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ============================================================
  # JOB 1: DATA PREPARATION
  # ============================================================
  data-preparation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas scikit-learn xgboost joblib

      - name: Validate data
        run: |
          python validate_data.py

      - name: Prepare data
        run: |
          python scripts/prepare_data.py

      - name: Upload train and test data
        uses: actions/upload-artifact@v4
        with:
          name: prepared-data
          path: |
            data/processed/train.csv
            data/processed/test.csv

  # ============================================================
  # JOB 2: MODEL TRAINING
  # ============================================================
  model-training:
    runs-on: ubuntu-latest
    needs: data-preparation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas scikit-learn xgboost joblib

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: prepared-data
          path: data/processed

      - name: Check downloaded files
        run: |
          ls -l data/processed

      - name: Train model
        run: |
          python scripts/train_model.py

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/best_model.pkl
            models/train_columns.pkl
            logs/experiment_logs.json
            logs/best_model_info.json

  # ============================================================
  # JOB 3: MODEL DEPLOYMENT
  # ============================================================
  model-deployment:
    runs-on: ubuntu-latest
    needs: model-training

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models

      - name: Verify model files
        run: |
          ls -l models/

      - name: Auto commit and push model to repository
        run: |
          git config --global user.email "Karishma.rk.patil@gmail.com"
          git config --global user.name "SweetyPatil1234"
          git add models/ logs/
          git diff --staged --quiet || git commit -m "Auto update model and logs from pipeline"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
