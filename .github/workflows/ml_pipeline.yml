
name: SuperKart ML Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  data-preparation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas scikit-learn

      - name: Validate data
        run: |
          python validate_data.py

      - name: Prepare data
        run: |
          python scripts/prepare_data.py

      - name: Upload train and test data
        uses: actions/upload-artifact@v4
        with:
          name: prepared-data
          path: |
            data/processed/train.csv
            data/processed/test.csv

  model-training:
    runs-on: ubuntu-latest
    needs: data-preparation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: prepared-data
          path: data/processed

      - name: Check downloaded files
        run: |
          ls -l data/processed
